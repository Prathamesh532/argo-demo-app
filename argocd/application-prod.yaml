apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yourusername/gitops-demo.git
    targetRevision: HEAD
    path: manifests/overlays/prod
  destination:
    server: https://your-prod-cluster-api-url
    namespace: demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
